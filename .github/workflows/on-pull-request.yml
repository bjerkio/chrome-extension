name: On Pull Request

on:
  pull_request:

jobs:
  build:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v2

      - name: Use Node LTS ✨
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies 📦️
        run: pnpm install --frozen-lockfile

      - name: Build 🏗️
        run: pnpm build

      - name: Test 🧪
        run: pnpm test

      - name: Lint 🧹
        run: pnpm lint

      - name: Format 🖌️
        run: pnpm format
